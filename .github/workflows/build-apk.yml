name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Launcher name shown under the Android app icon"
        required: true
        type: string
        default: "GrokBot Avatar Hub"
      sites:
        description: "One editor per line: Editor 1 | https://example.com"
        required: true
        type: string
        default: |-
          Editor 1 | https://bloub.vercel.app/
          Editor 2 | https://avatars.bible-strong.app/
          Editor 3 | https://grokbots.ai/studio
      icon_path:
        description: "Optional repo path to PNG/JPG/WebP icon"
        required: false
        type: string
        default: "assets/grok_icon.png"
      background_color:
        description: "Launcher background hex color"
        required: true
        type: string
        default: "#0B0B0B"
      card_color:
        description: "Launcher card hex color"
        required: true
        type: string
        default: "#171717"
      version_name:
        description: "Release version name"
        required: true
        type: string
        default: "1.0.1"
      version_code:
        description: "Release version code"
        required: true
        type: string
        default: "2"
      text_color:
        description: "Launcher text hex color"
        required: true
        type: string
        default: "#FFFFFF"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Configure app
        env:
          APP_NAME: ${{ inputs.app_name }}
          SITES: ${{ inputs.sites }}
          ICON_PATH: ${{ inputs.icon_path }}
          BACKGROUND_COLOR: ${{ inputs.background_color }}
          CARD_COLOR: ${{ inputs.card_color }}
          TEXT_COLOR: ${{ inputs.text_color }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: python3 scripts/configure.py

      - name: Verify generated launcher data
        run: |
          test -s app/src/main/assets/apps.json
          grep -q "isMinifyEnabled = false" app/build.gradle.kts
          test -f app/src/main/res/drawable-nodpi/grokbot_launcher_icon.webp || test -f app/src/main/res/drawable-nodpi/grokbot_launcher_icon.png || test -f app/src/main/res/drawable-nodpi/grokbot_launcher_icon.jpg || test -f app/src/main/res/drawable-nodpi/grokbot_launcher_icon.jpeg
          test ! -e app/src/main/res/drawable/app_icon.xml

      - name: Build release APK and AAB
        run: gradle assembleRelease bundleRelease

      - name: Sign release APK/AAB
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Release keystore secrets are not configured; creating a temporary key for testing only."
            keytool -genkeypair -keystore build.keystore -alias lnkapk -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=LNK-APK"
            KS=build.keystore; KSP=android; ALIAS=lnkapk; KP=android
          else
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > build.keystore
            KS=build.keystore; KSP="$RELEASE_KEYSTORE_PASSWORD"; ALIAS="$RELEASE_KEY_ALIAS"; KP="$RELEASE_KEY_PASSWORD"
          fi
          $ANDROID_HOME/build-tools/36.0.0/apksigner sign --ks "$KS" --ks-pass pass:"$KSP" --key-pass pass:"$KP" --out app-release.apk app/build/outputs/apk/release/app-release-unsigned.apk
          jarsigner -keystore "$KS" -storepass "$KSP" -keypass "$KP" app/build/outputs/bundle/release/app-release.aab "$ALIAS"


      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          TAG="v${VERSION_NAME}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "GrokBot Avatar Hub ${VERSION_NAME}" \
              --notes "Download GrokBot Avatar Hub for Android. The APK is ready to install directly from GitHub."
          fi
          gh release upload "$TAG" app-release.apk app/build/outputs/bundle/release/app-release.aab --clobber

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: LNK-APK-${{ inputs.version_name }}
          path: |
            app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
