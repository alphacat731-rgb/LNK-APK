name: Build APK
on:
  workflow_dispatch:
    inputs:
      app_name: {description: App name, required: true, type: string}
      website_url: {description: Website URL, required: true, type: string}
      icon_base64: {description: Compressed WebP base64, required: false, type: string}
      icon_mime: {description: Icon MIME, required: false, type: string, default: image/webp}
      request_id: {description: Unique build ID, required: true, type: string}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.10"}
      - name: Configure app
        env:
          APP_NAME: ${{ inputs.app_name }}
          WEBSITE_URL: ${{ inputs.website_url }}
          ICON_BASE64: ${{ inputs.icon_base64 }}
          ICON_MIME: ${{ inputs.icon_mime }}
        run: python3 scripts/configure.py
      - run: gradle assembleRelease
      - name: Generate temporary signing key
        run: keytool -genkeypair -keystore build.keystore -alias lnkapk -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=LNK-APK"
      - name: Sign APK
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner sign --ks build.keystore --ks-pass pass:android --key-pass pass:android --out app-release.apk app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ inputs.request_id }}
          APP_NAME: ${{ inputs.app_name }}
        run: gh release create "build-${REQUEST_ID}" app-release.apk --title "${APP_NAME} APK (${REQUEST_ID})" --notes "Generated by LNK-APK." --target "${GITHUB_SHA}"