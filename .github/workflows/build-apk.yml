name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Name shown under the Android app icon"
        required: true
        type: string
        default: "My Web App"
      website_url:
        description: "Website URL, including https://"
        required: true
        type: string
      icon_path:
        description: "Optional repo path to PNG/JPG icon, e.g. assets/icon.png"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Configure app
        env:
          APP_NAME: ${{ inputs.app_name }}
          WEBSITE_URL: ${{ inputs.website_url }}
          ICON_PATH: ${{ inputs.icon_path }}
        run: python3 scripts/configure.py

      - name: Build unsigned APK
        run: gradle assembleRelease

      - name: Generate temporary signing key
        run: keytool -genkeypair -keystore build.keystore -alias lnkapk -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=LNK-APK"

      - name: Sign APK
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner sign --ks build.keystore --ks-pass pass:android --key-pass pass:android --out app-release.apk app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LNK-APK
          path: app-release.apk
          if-no-files-found: error
