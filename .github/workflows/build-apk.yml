name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Launcher name shown under the Android app icon"
        required: true
        type: string
        default: "GrokBot Avatar Hub"
      sites:
        description: "One editor per line: Editor 1 | https://example.com"
        required: true
        type: string
        default: |-
          Editor 1 | https://bloub.vercel.app/
          Editor 2 | https://avatars.bible-strong.app/
          Editor 3 | https://grokbots.ai/studio
      icon_path:
        description: "Optional repo path to PNG/JPG icon"
        required: false
        type: string
        default: "assets/grok_icon.png"
      background_color:
        description: "Launcher background hex color"
        required: true
        type: string
        default: "#111111"
      card_color:
        description: "Launcher card hex color"
        required: true
        type: string
        default: "#202020"
      text_color:
        description: "Launcher text hex color"
        required: true
        type: string
        default: "#FFFFFF"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Configure app
        env:
          APP_NAME: ${{ inputs.app_name }}
          SITES: ${{ inputs.sites }}
          ICON_PATH: ${{ inputs.icon_path }}
          BACKGROUND_COLOR: ${{ inputs.background_color }}
          CARD_COLOR: ${{ inputs.card_color }}
          TEXT_COLOR: ${{ inputs.text_color }}
        run: python3 scripts/configure.py

      - name: Verify generated launcher data
        run: |
          test -s app/src/main/assets/apps.json
          grep -q "isMinifyEnabled = false" app/build.gradle.kts

      - name: Build unsigned APK
        run: gradle assembleRelease

      - name: Generate temporary signing key
        run: keytool -genkeypair -keystore build.keystore -alias lnkapk -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=LNK-APK"

      - name: Sign APK
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner sign --ks build.keystore --ks-pass pass:android --key-pass pass:android --out app-release.apk app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LNK-APK
          path: app-release.apk
          if-no-files-found: error
