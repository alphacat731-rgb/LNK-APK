<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b0f"><title>LNK-APK</title><style>:root{color-scheme:dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b0b0f;color:#f7f7fa;display:grid;place-items:center;padding:18px}.card{width:min(100%,560px);background:#15151b;border:1px solid #292933;border-radius:24px;padding:24px}h1{margin:0 0 6px}p{color:#aaa;line-height:1.45}label{display:block;font-size:13px;color:#bbb;margin:16px 0 7px}input{width:100%;padding:14px;border-radius:13px;border:1px solid #343440;background:#0d0d12;color:#fff;font-size:16px}button{width:100%;padding:15px;border:0;border-radius:13px;font-weight:800;cursor:pointer;background:#fff;color:#111;margin-top:18px}button:disabled{opacity:.5}.status{margin-top:18px;padding:14px;border-radius:13px;background:#0e0e13;display:none}.status.show{display:block}.progress{height:8px;background:#292933;border-radius:99px;overflow:hidden;margin-top:12px}.bar{height:100%;width:0;background:#fff;transition:width .3s}.success{margin-top:14px;padding:14px;border-radius:13px;background:#102014}.download{display:block;text-align:center;text-decoration:none;background:#fff;color:#111;padding:14px;border-radius:12px;font-weight:800;margin-top:12px}.small{font-size:12px;color:#777;margin-top:14px}</style></head><body><div class="card"><h1>🔗 LNK-APK</h1><p>Turn a website into a clean fullscreen Android app. No browser/search bar.</p><label>App name</label><input id="name" maxlength="30" placeholder="My Website"><label>Website URL</label><input id="url" inputmode="url" placeholder="https://example.com"><label>App icon (PNG/JPG)</label><input id="icon" type="file" accept="image/png,image/jpeg,.png,.jpg,.jpeg"><label>Build password</label><input id="password" type="password" placeholder="Your private build password"><button id="build">BUILD APK</button><div class="status" id="status"><b id="statusText">Preparing…</b><div class="progress"><div class="bar" id="bar"></div></div><div class="small" id="statusSmall"></div></div><div class="success" id="success" hidden><b>Your APK is ready.</b><a class="download" id="download" target="_blank" rel="noopener">DOWNLOAD APK</a></div><div class="small">Your icon is resized in the browser before upload.</div></div><script src="./site/config.js"></script><script>const $=id=>document.getElementById(id);let selectedFile=null;$("icon").onchange=e=>selectedFile=e.target.files[0]||null;$("build").onclick=async()=>{const worker=(window.LNK_APK_CONFIG||{}).WORKER_URL||"",name=$("name").value.trim()||"My Web App",url=$("url").value.trim(),password=$("password").value;if(!worker||worker.includes("YOUR-WORKER"))return alert("Set WORKER_URL in site/config.js first.");if(!/^https?:\\/\\//i.test(url))return alert("Use http:// or https://");if(!password)return alert("Enter the build password.");$("build").disabled=true;$("status").classList.add("show");try{let icon="";if(selectedFile){const blob=await smallWebp(selectedFile);icon=await b64(blob)}set(20,"Starting Android build…");const r=await fetch(worker.replace(/\\/$/,"")+"/api/build",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({name,url,password,icon,mime:"image/webp"})});const d=await r.json();if(!r.ok)throw Error(d.error||"Build failed");for(let i=0;i<90;i++){await new Promise(x=>setTimeout(x,4000));set(Math.min(90,30+i),"Building APK…");const q=await fetch(worker.replace(/\\/$/,"")+"/api/status?id="+encodeURIComponent(d.id),{headers:{"X-Build-Password":password}}),s=await q.json();if(s.status==="ready"){set(100,"Finished.");$("download").href=s.download_url;$("success").hidden=false;break}if(s.status==="failed")throw Error(s.error||"Build failed")} }catch(e){$("statusText").textContent="Error";$("statusSmall").textContent=e.message;set(0,"Build stopped.")}finally{$("build").disabled=false}};async function smallWebp(f){const b=await createImageBitmap(f),m=256,s=Math.min(1,m/Math.max(b.width,b.height)),c=document.createElement("canvas");c.width=Math.max(1,b.width*s);c.height=Math.max(1,b.height*s);c.getContext("2d").drawImage(b,0,0,c.width,c.height);for(const q of [.82,.72,.62,.52,.42]){const x=await new Promise(r=>c.toBlob(r,"image/webp",q));if(x&&x.size<42000)return x}throw Error("Icon is too large/complex.")}function b64(b){return new Promise((r,j)=>{const f=new FileReader;f.onload=()=>r(f.result.split(",")[1]);f.onerror=j;f.readAsDataURL(b)})}function set(n,t){$("bar").style.width=n+"%";$("statusText").textContent=t}</script></body></html>
